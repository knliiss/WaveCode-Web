name: Web

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          archive="wasm-pack-v0.15.1-x86_64-unknown-linux-musl"
          curl --fail --location --retry 3 --silent --show-error \
            "https://github.com/rustwasm/wasm-pack/releases/download/v0.15.1/${archive}.tar.gz" \
            -o /tmp/wasm-pack.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          mkdir -p "$CARGO_HOME/bin"
          install -m 755 "/tmp/${archive}/wasm-pack" "$CARGO_HOME/bin/wasm-pack"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          "$CARGO_HOME/bin/wasm-pack" --version
      - run: npm install --no-audit --no-fund
      - run: npm run sdk:build
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end browser checks
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavecode-web-browser-tests
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: wavecode-web-dist
          path: dist/
          if-no-files-found: error
