name: Web

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest
      - run: npm install --no-audit --no-fund
      - run: npm run sdk:build
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install browser
        run: npx playwright install chromium webkit
      - name: Install WebKit runtime libraries
        run: |
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-1 libgraphene-1.0-0 libevent-2.1-7t64 libopus0 \
            libgstreamer-plugins-base1.0-0 libgstreamer-gl1.0-0 \
            libgstreamer-plugins-bad1.0-0 libavif16 libharfbuzz-icu0 \
            libsoup-3.0-0 libwayland-server0 libmanette-0.2-0 \
            libsecret-1-0 libhyphen0 libgles2 gstreamer1.0-libav
      - name: End-to-end browser checks
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wavecode-web-browser-tests
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: wavecode-web-dist
          path: dist/
          if-no-files-found: error
